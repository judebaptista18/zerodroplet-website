version: 1
frontend:
  phases:
    preBuild:
      commands:
        - nvm install 22.14.0
        - nvm use 22.14.0
        - npm install --global pnpm@10.14.0
        - pnpm install --frozen-lockfile --store-dir .pnpm-store
    build:
      commands:
        - pnpm run build
  artifacts:
    baseDirectory: .next
    files:
      - '**/*'
  cache:
    paths:
      - .pnpm-store/**/*
      - .next/cache/**/*
